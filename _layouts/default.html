<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - DH101</title>
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>
<body>
    <div class="page-wrapper">
        <nav class="liquid-glass">
            <div class="container">
                <h1 class="site-title"><a href="{{ '/' | relative_url }}">DH101</a></h1>
                <ul class="nav-links">
                    <li><a href="{{ '/' | relative_url }}#home">Home</a></li>
                    <li><a href="{{ '/' | relative_url }}#reflections">Reflections</a></li>
                    <li><a href="{{ '/pages/about/' | relative_url }}">About</a></li>
                </ul>
            </div>
        </nav>

        <main class="container page-content">
            {{ content }}
        </main>

        <footer>
            <div class="container">
                <p>&copy; 2026 DH101 Project</p>
            </div>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.body.classList.add('page-loaded');
        });

        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('http') && !href.startsWith('mailto:') && !href.startsWith('#')) {
                    e.preventDefault();
                    document.body.classList.remove('page-loaded');
                    setTimeout(() => {
                        window.location.href = href;
                    }, 300);
                }
            });
        });
    </script>
</body>
</html>
